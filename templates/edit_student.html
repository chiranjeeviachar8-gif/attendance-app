{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-4">
            <h4 class="mb-3">Edit Student</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Roll No</label>
                    <input type="text" name="roll_no" class="form-control" value="{{ student['roll_no'] }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" value="{{ student['name'] }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Class</label>
                    <input type="text" name="class_name" class="form-control" value="{{ student['class_name'] or '' }}">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                    <a href="{{ url_for('students') }}" class="btn btn-outline-secondary w-100">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
